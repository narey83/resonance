name: Caddy site health

on:
  push:
    branches: [main]
    paths:
      - 'ops/caddy/**'
      - 'frontend/src/components/FrontendHealthBoundary*'
      - 'frontend/src/components/App.jsx'
      - 'frontend/src/index.jsx'
      - 'frontend/package*.json'
      - 'bin/site-state'
      - 'docker/maintenance/maintenance.py'
      - 'docker/tests/test_maintenance.py'
      - 'backend/Core/SiteReadiness.cs'
      - 'backend/Core/API/Controllers/SiteHealthController.cs'
      - '.github/workflows/site-health.yml'
  pull_request:
    paths:
      - 'ops/caddy/**'
      - 'frontend/src/components/FrontendHealthBoundary*'
      - 'frontend/src/components/App.jsx'
      - 'frontend/src/index.jsx'
      - 'frontend/package*.json'
      - 'bin/site-state'
      - 'docker/maintenance/maintenance.py'
      - 'docker/tests/test_maintenance.py'
      - 'backend/Core/SiteReadiness.cs'
      - 'backend/Core/API/Controllers/SiteHealthController.cs'
      - '.github/workflows/site-health.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing:
    name: Caddy availability routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify official Caddy binary
        shell: bash
        run: |
          set -euo pipefail
          caddy_test_dir="$RUNNER_TEMP/caddy-site-test"
          mkdir -p "$caddy_test_dir"
          caddy_version=2.11.7
          caddy_archive="caddy_${caddy_version}_linux_amd64.tar.gz"
          caddy_base="https://github.com/caddyserver/caddy/releases/download/v${caddy_version}"
          curl -fsSL --retry 3 --max-time 180 "$caddy_base/$caddy_archive" -o "$caddy_test_dir/$caddy_archive"
          curl -fsSL --retry 3 --max-time 180 "$caddy_base/caddy_${caddy_version}_checksums.txt" -o "$caddy_test_dir/checksums.txt"
          cd "$caddy_test_dir"
          grep "  $caddy_archive$" checksums.txt | sha512sum --check -
          tar -xzf "$caddy_archive" caddy
          chmod +x caddy
          echo "CADDY_BIN=$caddy_test_dir/caddy" >> "$GITHUB_ENV"
      - name: Test availability routing against real Caddy
        run: python3 -m unittest discover -s ops/caddy/tests -v
      - name: Test existing authenticated restart control
        env:
          STATE_DIR: ${{ runner.temp }}/maintenance-control-test
        run: python3 -m unittest discover -s docker/tests -p test_maintenance.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test browser-health state, deadlines and local recovery
        run: |
          node --test ops/caddy/tests/frontend-health.test.mjs
          cd frontend
          CI=true npm test -- --watchAll=false --runInBand FrontendHealthBoundary siteAvailability siteRecoveryPage
      - name: Allow the downloaded test browser to use its sandbox on restricted Ubuntu runners
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            browser_executable="$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -print -quit)"
            test -n "$browser_executable"
            browser_profile="$RUNNER_TEMP/resonance-browser.apparmor"
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile resonance-ci-browser "%s" flags=(unconfined) {\n  userns,\n}\n' "$browser_executable" > "$browser_profile"
            sudo apparmor_parser --add "$browser_profile"
          fi
      - name: Build the real frontend for browser health checks
        working-directory: frontend
        run: npm run build
      - name: Exercise failures and automatic recovery through real Caddy and Chromium
        run: python3 ops/caddy/tests/browser_check.py
      - name: Verify HTTPS media startup, seeking and connection recovery
        run: |
          python3 ops/caddy/tests/media_transport_check.py
          python3 ops/caddy/tests/http3_resumption_check.py
