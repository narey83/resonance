name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Local commit gate regression tests
        run: python3 .githooks/test_pre_commit.py
      - name: Development container shutdown
        run: python3 docker/scripts/test-backend-watch.py
      - name: Restore
        run: dotnet restore resonance.sln
      - name: Build
        run: |
          set -o pipefail
          stylecop_build_log="$(mktemp)"
          trap 'rm -f "$stylecop_build_log"' EXIT
          dotnet build resonance.sln --configuration Release --no-restore 2>&1 | tee "$stylecop_build_log"
          if grep -qE 'warning SA[0-9]+:' "$stylecop_build_log"; then
            echo "::error::StyleCop warnings must be fixed before merging."
            exit 1
          fi
      - name: Test
        run: dotnet test tests/Resonance.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Full dependency security audit
        run: npm run audit:security
      - name: Dependency security regressions
        run: npm run test:dependency-security
      - name: Node compatibility (HTTP and WebSocket)
        run: npm run test:node-compat
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test-unattended

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Dependency security audit
        run: npm run audit:security
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test

  # Native builds are the longest jobs in CI (a native CMake/ninja compile on a
  # single-capacity runner), and their outputs change only when the app itself
  # does -- so backend- or frontend-only changes skip these builds. This job decides
  # that, and both native build jobs below read its answer. A plain git diff avoids a
  # third-party dependency and behaves the same
  # if Gitea Actions is ever pointed at this repo.
  mobile-changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      # Full history includes the pull request base or the previous push commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A first push, a force-push, or a base that is simply not in this clone leaves
          # nothing to compare against. Build in that case: a redundant APK costs runner
          # minutes, a wrongly skipped one means main has no artifact for a real change.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no usable diff base ($BEFORE) — building native apps"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Workflow changes also need native builds to verify them.
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- mobile .github/workflows/ci.yml | grep -q .; then
            echo "mobile/ or ci.yml changed in $BEFORE..$GITHUB_SHA — building native apps"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no mobile/ or ci.yml changes in $BEFORE..$GITHUB_SHA — skipping native apps"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  mobile-apk:
    name: Mobile APK (Android)
    # Build native artifacts on mobile/workflow changes, including pull requests.
    if: needs.mobile-changes.outputs.changed == 'true'
    needs: [mobile, mobile-changes]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # packages: the action's default, 'tools platform-tools', names the long-obsolete SDK
      # Tools package; since cmdline-tools 16.0 sdkmanager fails on it instead of warning,
      # which killed this job from 2026-09-15. Gradle installs the build-tools, platforms and
      # NDK it needs on its own, so platform-tools is all this step has to provide.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install
      # android/ is regenerated by prebuild above (gitignored), so the cache
      # key can only be computed — and the .cxx native-build cache only
      # applies — after this step runs.
      - name: Cache Gradle + native (CMake/ninja) build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/app/.cxx
            mobile/android/app/build/intermediates/cxx
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/package-lock.json') }}
          restore-keys: gradle-
      # Debug-signed (standard RN debug keystore, not secret) — fine for
      # internal sideloading, not for distributing outside the team.
      # arm64-v8a only: covers virtually all real devices, and skipping
      # armeabi-v7a/x86/x86_64 keeps the native (CMake/ninja) compile from
      # taking hours on a single-capacity runner. Widen this if the release
      # signing setup gets built out for real distribution later.
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      # v4, not v3: GitHub.com has hard-failed v3 since 2025-01-30. The failure lands on
      # "Set up job" before any step runs, because the runner resolves every action in the
      # job up front -- so a step-level `if:` cannot hold a v3 reference out of harm's way,
      # and the whole job dies whether or not that step would have executed.
      # If Gitea Actions is ever enabled for this repo, v4 will not work there (Gitea
      # identifies as GHES and v4 aborts with GHESNotSupportedError); because of the same
      # up-front resolution, that needs a separate host-conditional *job*, not a step.
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  mobile-ios:
    name: Mobile app (iOS simulator)
    if: needs.mobile-changes.outputs.changed == 'true'
    needs: [mobile, mobile-changes]
    # The arm64 pool repeatedly failed to acquire a runner before any step ran.
    # Keep macOS 26 / Xcode 26.4 while using the separate Intel runner pool.
    runs-on: macos-26-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: 'true'
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install
      - name: Build simulator app
        run: |
          xcodebuild -workspace ios/Resonance.xcworkspace \
            -scheme Resonance -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/Build/Products/Release-iphonesimulator/Resonance.app \
            resonance-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-mobile-ios-simulator
          path: mobile/resonance-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
