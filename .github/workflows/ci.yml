name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore resonance.sln
      - name: Build
        run: dotnet build resonance.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/Resonance.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test-unattended

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc --noEmit

  mobile-apk:
    name: Mobile APK (Android)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [mobile]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install
      # android/ is regenerated by prebuild above (gitignored), so the cache
      # key can only be computed — and the .cxx native-build cache only
      # applies — after this step runs.
      - name: Cache Gradle + native (CMake/ninja) build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/app/.cxx
            mobile/android/app/build/intermediates/cxx
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/package-lock.json') }}
          restore-keys: gradle-
      # Debug-signed (standard RN debug keystore, not secret) — fine for
      # internal sideloading, not for distributing outside the team.
      # arm64-v8a only: covers virtually all real devices, and skipping
      # armeabi-v7a/x86/x86_64 keeps the native (CMake/ninja) compile from
      # taking hours on a single-capacity runner. Widen this if the release
      # signing setup gets built out for real distribution later.
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      # No single version of upload-artifact runs on both hosts, so pick per host:
      # GitHub.com hard-fails v3 ("automatically failed because it uses a deprecated
      # version") since 2025-01-30, while on Gitea v4 aborts with GHESNotSupportedError
      # because Gitea identifies as GHES and v4 refuses to run there.
      # github.server_url is https://github.com only on GitHub; on Gitea it is the
      # instance's own URL.
      - name: Upload APK (GitHub)
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@v4
        with:
          name: resonance-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Upload APK (Gitea)
        if: ${{ github.server_url != 'https://github.com' }}
        uses: actions/upload-artifact@v3
        with:
          name: resonance-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
