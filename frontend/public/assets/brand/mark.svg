<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" role="img" aria-label="Big Play logo with an expanding play triangle and two shockwaves">
  <defs>
    <clipPath id="tile"><rect width="128" height="128" rx="28"/></clipPath>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="white"/>
      <path class="triangle" d="M47 37l39 15-39 16Z" fill="black"/>
    </mask>
  </defs>
  <style>
    .wave { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .triangle, .wave, .letter { transform-origin: 60px 52px; }
      .triangle { animation: impact 3.6s infinite; }
      .letter { animation: recoil 3.6s infinite; }
      .wave { animation: ring 3.6s infinite; }
      .late { animation-delay: .14s; }
    }
    @keyframes impact {
      0%, 29%, 71%, 100% { transform: scale(1); }
      40% { transform: translateX(-3px) scale(.5); animation-timing-function: cubic-bezier(.16,.8,.24,1); }
      49% { transform: translateX(13px) scale(3.4); }
      62% { transform: translateX(-2px) scale(.87); }
    }
    @keyframes recoil {
      0%, 30%, 73%, 100% { transform: scale(1); }
      42% { transform: scale(.95); }
      50% { transform: scale(1.12); }
      64% { transform: scale(.98); }
    }
    @keyframes ring {
      0%, 42% { opacity: 0; transform: scale(.55); }
      48% { opacity: .9; }
      73%, 100% { opacity: 0; transform: scale(3.9); }
    }
  </style>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="#121F20"/>
    <g class="letter" mask="url(#cut)">
      <path fill="#9BE3D1" d="M29 100V28h46a24 24 0 0 1 7 47l18 25H76L57 76h-7v24Z"/>
    </g>
    <path class="wave" d="M47 37l39 15-39 16Z" fill="none" stroke="#9BE3D1" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <path class="wave late" d="M47 37l39 15-39 16Z" fill="none" stroke="#9BE3D1" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </g>
</svg>
