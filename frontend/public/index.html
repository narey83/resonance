<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Resonance</title>
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="16x16 32x32 48x48 64x64" />
        <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <meta name="theme-color" content="#0C1020" />
        <link rel="stylesheet" href="./brand.css" />
        <link rel="preload" href="./fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="./fonts/Outfit.woff2" as="font" type="font/woff2" crossorigin />
        <style>
            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                font-family: 'Inter', sans-serif;
                background: var(--s-bg, #f4f5f7);
                z-index: 9999;
            }
            #splash-icon {
                width: 52px;
                height: 52px;
                border-radius: 14px;
                background: var(--s-icon-bg, #ebedf0);
                border: 1px solid var(--s-border, #dde1e7);
                color: var(--s-accent, #0052cc);
                display: flex;
                align-items: center;
                justify-content: center;
                animation: s-pulse 2s ease-in-out infinite;
            }
            #splash-name {
                font-family: 'Outfit', 'Inter', sans-serif;
                font-size: 20px;
                font-weight: 600;
                letter-spacing: -0.3px;
                color: var(--s-fg, #172b4d);
            }
            #splash-dots {
                display: flex;
                gap: 5px;
            }
            #splash-dots span {
                display: block;
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--s-accent, #0052cc);
                animation: s-bounce 1.2s ease-in-out infinite;
            }
            #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
            #splash-dots span:nth-child(3) { animation-delay: 0.4s; }
            @keyframes s-pulse {
                0%, 100% { box-shadow: 0 0 0 0 rgba(var(--s-accent-rgb, 0, 82, 204), 0); }
                50%       { box-shadow: 0 0 0 8px rgba(var(--s-accent-rgb, 0, 82, 204), 0.14); }
            }
            @keyframes s-bounce {
                0%, 80%, 100% { transform: translateY(0);    opacity: 0.3; }
                40%           { transform: translateY(-5px); opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce) {
                #splash-icon, #splash-dots span { animation: none; }
            }
        </style>
        <script>
            window.addEventListener('error', function(e) {
                if (e.message && e.message.indexOf('ResizeObserver loop') !== -1) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            });
        </script>
        <script>
            (function () {
                function hexToRgb(hex) {
                    return [
                        parseInt(hex.slice(1, 3), 16),
                        parseInt(hex.slice(3, 5), 16),
                        parseInt(hex.slice(5, 7), 16)
                    ].join(',');
                }
                var themes = {
                    light:  { bg: '#f4f5f7', fg: '#172b4d', accent: '#0052cc', iconBg: '#ebedf0', border: '#dde1e7' },
                    amoled: { bg: '#000000', fg: '#e8eaed', accent: '#8ab4f8', iconBg: '#161616', border: 'rgba(255,255,255,0.08)' },
                };
                var t = themes[localStorage.getItem('resonance-theme')];
                var s = document.documentElement.style;
                if (t) {
                    s.setProperty('--s-bg',         t.bg);
                    s.setProperty('--s-fg',         t.fg);
                    s.setProperty('--s-accent',     t.accent);
                    s.setProperty('--s-accent-rgb', hexToRgb(t.accent));
                    s.setProperty('--s-icon-bg',    t.iconBg);
                    s.setProperty('--s-border',     t.border);
                } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    s.setProperty('--s-bg',         '#000000');
                    s.setProperty('--s-fg',         '#e8eaed');
                    s.setProperty('--s-accent',     '#8ab4f8');
                    s.setProperty('--s-accent-rgb', '138,180,248');
                    s.setProperty('--s-icon-bg',    '#161616');
                    s.setProperty('--s-border',     'rgba(255,255,255,0.08)');
                }
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="splash">
            <div id="splash-icon">
                <img src="./assets/brand/mark.svg" width="44" height="44" alt="" />
            </div>
            <div id="splash-name">Resonance</div>
            <div id="splash-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div id="root"></div>
        <!-- Google Cast Sender SDK — loaded last so it doesn't block render -->
        <script>
            window['__onGCastApiAvailable'] = function(isAvailable) {
                window['_castApiAvailable'] = isAvailable;
                document.dispatchEvent(new Event('castApiAvailable'));
            };
        </script>
        <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
        <script>
            new MutationObserver(function (_, obs) {
                if (document.getElementById('root').childElementCount > 0) {
                    var el = document.getElementById('splash');
                    if (el) el.remove();
                    obs.disconnect();
                }
            }).observe(document.getElementById('root'), { childList: true });
        </script>
    </body>
</html>
