<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Resonance</title>
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="shortcut icon" href="./favicon.svg" />
        <style>
            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: var(--s-bg, #f4f5f7);
                z-index: 9999;
            }
            #splash-icon {
                width: 52px;
                height: 52px;
                border-radius: 14px;
                background: var(--s-icon-bg, #ebedf0);
                border: 1px solid var(--s-border, #dde1e7);
                color: var(--s-accent, #0052cc);
                display: flex;
                align-items: center;
                justify-content: center;
                animation: s-pulse 2s ease-in-out infinite;
            }
            #splash-name {
                font-size: 20px;
                font-weight: 600;
                letter-spacing: -0.3px;
                color: var(--s-fg, #172b4d);
            }
            #splash-dots {
                display: flex;
                gap: 5px;
            }
            #splash-dots span {
                display: block;
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--s-accent, #0052cc);
                animation: s-bounce 1.2s ease-in-out infinite;
            }
            #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
            #splash-dots span:nth-child(3) { animation-delay: 0.4s; }
            @keyframes s-pulse {
                0%, 100% { box-shadow: 0 0 0 0 rgba(var(--s-accent-rgb, 0, 82, 204), 0); }
                50%       { box-shadow: 0 0 0 8px rgba(var(--s-accent-rgb, 0, 82, 204), 0.14); }
            }
            @keyframes s-bounce {
                0%, 80%, 100% { transform: translateY(0);    opacity: 0.3; }
                40%           { transform: translateY(-5px); opacity: 1; }
            }
        </style>
        <script>
            window.addEventListener('error', function(e) {
                if (e.message && e.message.indexOf('ResizeObserver loop') !== -1) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            });
        </script>
        <script>
            (function () {
                function hexToRgb(hex) {
                    return [
                        parseInt(hex.slice(1, 3), 16),
                        parseInt(hex.slice(3, 5), 16),
                        parseInt(hex.slice(5, 7), 16)
                    ].join(',');
                }
                var themes = {
                    dark:            { bg: '#0d1117',  fg: '#e6edf3', accent: '#388bfd', iconBg: '#21262d', border: 'rgba(240,246,252,0.1)' },
                    dim:             { bg: '#1a1d2e',  fg: '#c8d0e8', accent: '#7c9ef0', iconBg: '#2b3050', border: 'rgba(255,255,255,0.07)' },
                    'pastel-blue':   { bg: '#ecf3fc',  fg: '#1a3558', accent: '#2a70d4', iconBg: '#dceaf8', border: '#b4cde9' },
                    'pastel-rose':   { bg: '#fbeef7',  fg: '#3c1038', accent: '#c93878', iconBg: '#f5dcef', border: '#e4b0d0' },
                    material:        { bg: '#fffbfe',  fg: '#1c1b1f', accent: '#6750a4', iconBg: '#e6e0e9', border: 'rgba(73,69,79,0.16)' },
                    'material-dark': { bg: '#1c1b1f',  fg: '#e6e1e5', accent: '#d0bcff', iconBg: '#36343b', border: 'rgba(230,225,229,0.12)' },
                    amoled:          { bg: '#000000',  fg: '#e8eaed', accent: '#8ab4f8', iconBg: '#161616', border: 'rgba(255,255,255,0.08)' },
                };
                var t = themes[localStorage.getItem('resonance-theme')];
                var s = document.documentElement.style;
                if (t) {
                    s.setProperty('--s-bg',         t.bg);
                    s.setProperty('--s-fg',         t.fg);
                    s.setProperty('--s-accent',     t.accent);
                    s.setProperty('--s-accent-rgb', hexToRgb(t.accent));
                    s.setProperty('--s-icon-bg',    t.iconBg);
                    s.setProperty('--s-border',     t.border);
                } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    s.setProperty('--s-bg',         '#0d1117');
                    s.setProperty('--s-fg',         '#e6edf3');
                    s.setProperty('--s-accent',     '#388bfd');
                    s.setProperty('--s-accent-rgb', '56,139,253');
                    s.setProperty('--s-icon-bg',    '#21262d');
                    s.setProperty('--s-border',     'rgba(240,246,252,0.1)');
                }
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="splash">
            <div id="splash-icon">
                <svg fill="none" height="36" viewBox="0 0 24 24" width="36" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
                    <path d="M4 12 C6 6.5 10 6.5 12 12 C14 17.5 18 17.5 20 12" stroke="currentColor" stroke-linecap="round" stroke-width="2"/>
                </svg>
            </div>
            <div id="splash-name">Resonance</div>
            <div id="splash-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div id="root"></div>
        <!-- Google Cast Sender SDK — loaded last so it doesn't block render -->
        <script>
            window['__onGCastApiAvailable'] = function(isAvailable) {
                window['_castApiAvailable'] = isAvailable;
                document.dispatchEvent(new Event('castApiAvailable'));
            };
        </script>
        <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
        <script>
            new MutationObserver(function (_, obs) {
                if (document.getElementById('root').childElementCount > 0) {
                    var el = document.getElementById('splash');
                    if (el) el.remove();
                    obs.disconnect();
                }
            }).observe(document.getElementById('root'), { childList: true });
        </script>
    </body>
</html>
