# Resonance dev stack — backend (dotnet watch) + frontend (craco) with the
# project's source bind-mounted for hot reload. Editing code on the host triggers
# rebuild/HMR inside the containers; you do NOT rebuild images for code changes.
#
# Networking: this stack runs on pre-existing EXTERNAL networks (created outside
# this compose file) instead of host networking:
#   - resonance_backend_net : backend, frontend, bgutil-provider, caddy (bridge)
#   - postgresql_net        : backend only, to reach the shared postgres-db container by name (bridge)
#   - resonance_caddy_proxy_net : caddy only, faces the outer/main reverse proxy (bridge)
#   - local_lan_net         : backend only, a macvlan giving it a real LAN address (see below)
# Services reach each other by container name/DNS on resonance_backend_net (e.g.
# caddy -> http://resonance-backend:5030) rather than localhost, and postgres-db
# is reached as `Host=postgres-db` (see backend's RESONANCE_DATABASE_CONNECTION_STRING
# below) instead of the old `Host=localhost` + host-published port 5432.
#
# Fixed 2026-08-23: postgresql_net's bridge interface had no working internet egress
# on this host because it wasn't assigned to firewalld's `docker` zone (Docker's own
# iptables MASQUERADE rule was correctly configured, but firewalld's default `public`
# zone -- where an unassigned interface falls back to -- rejected the forwarded
# traffic before it ever reached that rule). Fixed with `firewall-cmd --zone=docker
# --add-interface=<postgresql_net's bridge> --permanent`, matching how
# resonance_backend_net and resonance_caddy_proxy_net were already configured.
#
# Fixed the same day, same zone: initially added `masquerade: yes` alongside the
# interface, assuming it was needed for the egress fix above. It wasn't -- Docker's
# own MASQUERADE rule already covers that (scoped to traffic sourced from the
# container subnet only). Firewalld's zone-level masquerade is broader: it was ALSO
# rewriting the source address of genuinely external inbound traffic (real Soulseek
# peers connecting to the published port 50300) to the bridge gateway address before
# it reached the container -- a classic Docker+firewalld double-NAT interaction,
# confirmed via tcpdump (a real peer's SYN showed its real IP on eno1, but the
# bridge gateway's IP by the time it reached the container). Removed masquerade from
# the zone (kept target: ACCEPT); egress still works via Docker's own rule, and real
# peer IPs now reach the container untouched. Neither fix is a compose-level
# concern, but recorded here since the symptoms (Soulseek failing to connect, then
# every peer appearing to connect from the same bridge-gateway IP) showed up here.
#
# backend also gets a macvlan network (local_lan_net, see the backend service below)
# giving it a real address on the LAN itself, alongside its bridge-network addresses.
# DLNA and UPnP both need direct LAN access -- SSDP multicast and gateway discovery
# don't work from behind a NAT'd bridge network -- but it deliberately is NOT the
# default route, so general traffic (API, Postgres, internet) keeps using the bridge
# networks. See the backend service's comments for how each integration is pointed
# at it explicitly instead of relying on route selection.
#
# Containers run as uid:gid 1000:1000 (narey) so runtime files written into the
# bind-mounted source (backend/data, logs) and downloads stay narey-owned.
# Build artifacts / caches use host scratch dirs under SCRATCH so they're
# isolated from the host's own bin/obj and have no named-volume permission issues.
#
# RESONANCE_SRC : project source checkout that gets bind-mounted (default: server path).
# RESONANCE_SCRATCH : throwaway build-cache dir owned by 1000 (default below).
# DOCKER_GID : gid of the host's docker group (`getent group docker`), so the
#              backend (uid 1000) can read /var/run/docker.sock for the system
#              stats shown on the Overview page. Wrong gid = feature silently off.
#
# postgres-db is shared infrastructure defined elsewhere; set its resource
# limits where that container is defined, not here.
#
# Build contexts are local to this directory, so the stack is self-contained and
# can live anywhere (e.g. /home/narey/containers/resonance) independent of the
# source it bind-mounts.
networks:
  resonance_caddy_proxy_net:
    name: resonance_caddy_proxy_net
    external: true
  resonance_backend_net:
    name: resonance_backend_net
    external: true
  postgresql_net:
    name: postgresql_net
    external: true
  local_lan_net:
    name: local_lan_net
    external: true

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: resonance-backend-dev
    container_name: resonance-backend
    # local_lan_net is a macvlan (parent eno1) giving the container a fixed address
    # on the LAN itself (192.168.0.33) alongside its bridge-network addresses. Needed
    # by DLNA and UPnP (Mono.Nat) for SSDP multicast/gateway discovery; gw_priority
    # pins it BELOW the bridge networks so it's never picked as the default/primary
    # network -- UPnP discovers/uses it regardless of default-route status, but DLNA's
    # own SSDP socket code binds explicitly (see DLNA_BIND_ADDRESS below) rather than
    # relying on routing, since an unbound multicast join/send follows the default route.
    #
    # resonance_backend_net is explicitly the highest-priority (primary) network,
    # matching the expected architecture: general traffic, and critically Docker's
    # port-publishing for 50300 below, go through it. Docker can only implement
    # published ports via a bridge network, never via a macvlan -- if local_lan_net
    # ends up primary instead, the 50300 publish doesn't just misroute, it silently
    # fails to exist at all (confirmed via `iptables -t nat -L DOCKER`, no rule
    # present). postgresql_net is deliberately left unprioritized (0); it only needs
    # to reach postgres-db by name, not carry general or published-port traffic.
    #
    # KNOWN ISSUE: gw_priority below is parsed correctly by Compose (visible in
    # `docker compose config`) but is NOT actually applied to the container -- the
    # resulting network endpoints all show GwPriority=0 regardless (confirmed
    # 2026-08-23, Docker Compose v5.1.0 / Engine 29.2.1). Every full recreate of this
    # service (`docker compose up -d --no-deps backend`, not `restart`) silently
    # reverts to Docker's own tiebreak, which has consistently picked local_lan_net --
    # breaking the 50300 publish and rerouting general traffic through the macvlan.
    #
    # Automated 2026-08-23: resonance-backend-netfix.service on the dev server watches
    # for backend container starts and reapplies the correct priorities via
    # docker/scripts/fix-backend-network.sh -- see that directory for the scripts and
    # the systemd unit (installed manually on the host, not deployed by git pull).
    # Manual reapply, if ever needed:
    #   docker network disconnect resonance_backend_net resonance-backend
    #   docker network connect --gw-priority 100 resonance_backend_net resonance-backend
    #   docker network disconnect local_lan_net resonance-backend
    #   docker network connect --ip 192.168.0.33 --gw-priority -100 local_lan_net resonance-backend
    #   # verify: docker exec resonance-backend cat /proc/net/route (default gw should be 172.20.0.1)
    #   # verify: sudo iptables -t nat -L DOCKER -n | grep 50300 (should DNAT to the backend's resonance_backend_net IP)
    networks:
      resonance_backend_net:
        gw_priority: 100
      postgresql_net: {}
      local_lan_net:
        ipv4_address: 192.168.0.33
        gw_priority: -100
    # Only the Soulseek P2P listen port is published to the host; HTTP/HTTPS
    # (5030/5031) are reached by caddy via resonance_backend_net instead.
    ports:
      - 50300:50300
      - 50300:50300/udp
    user: "1000:1000"
    # docker group, for read access to docker.sock (system stats monitoring).
    group_add:
      - "${DOCKER_GID:-990}"
    # Resource ceilings are tunables — sized from observed usage (dotnet watch
    # idles ~5g on the 2-core/15g server) so a runaway can't starve the host,
    # which runs many other services.
    mem_limit: 8g
    cpus: 1.5
    working_dir: /src
    # --no-launch-profile: launchSettings.json hardcodes a host-only RESONANCE_APP_DIR
    # and would override the container env below. We supply the container values here.
    #
    # --no-hot-reload: hot reload patches IL in the already-running process without
    # re-running Program.Main, so it never re-executes startup-only code -- DI
    # registration, EF OnModelCreating, the schema-init script that runs CREATE INDEX.
    # dotnet watch still reports "changes applied" for these, but nothing actually
    # changes until the process restarts, which is what made watch look broken (e.g.
    # the LogEntries trigram index: watch said applied, index never existed in
    # Postgres). Forcing a full restart on every change is slower per-iteration but
    # is the only way changes to that kind of code reliably take effect.
    command: dotnet watch --project backend/resonance.csproj run --no-launch-profile --no-hot-reload
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ASPNETCORE_ENVIRONMENT: Development
      RESONANCE_APP_DIR: /src/backend
      # Config lives in the database (settings schema). The connection string is the one setting that
      # cannot live in the database it points at, so it is supplied here (override via host env in prod).
      # Host=postgres-db resolves via postgresql_net's container DNS (see networks above).
      RESONANCE_DATABASE_CONNECTION_STRING: "${RESONANCE_DATABASE_CONNECTION_STRING:-Host=postgres-db;Database=resonance;Username=resonance;Password=resonance}"
      HOME: /home/dev
      DOTNET_CLI_HOME: /home/dev
      NUGET_PACKAGES: /home/dev/.nuget
      DLNA: "true"
      DLNA_FRIENDLY_NAME: "Resonance"
      # local_lan_net's static IP (see networks above) -- DLNA's own SSDP socket code
      # binds to this explicitly rather than relying on the OS default route.
      DLNA_BIND_ADDRESS: "192.168.0.33"
      NO_COLOR: "1"
      # DB-only logging (deliberate switch, 2026-08-23): disk/JSONL logging off, Postgres
      # is the sole log store and log-viewer source. Accepted tradeoff: log writes can
      # occasionally hit a transient SaveChanges timeout under DB load on this small
      # shared instance (see LogsDbContext).
      RESONANCE_DISK_LOGGER: "false"
      RESONANCE_POSTGRES_LOGGER: "true"
      # Used by Integrations/Scripts as the default script executable.
      SHELL: "/usr/bin/bash"
    volumes:
      - ${RESONANCE_SRC:-/home/narey/projects/resonance}:/src
      # Isolate build artifacts from the host's own bin/obj (host scratch, narey-owned).
      # tests/ needs the same treatment as backend/: any solution-level restore in here
      # (`dotnet restore resonance.sln`, `dotnet test`) writes tests/obj with this
      # container's NUGET_PACKAGES (/home/dev/.nuget), which the host cannot resolve —
      # the host IDE then fails with "package ... was not found" until it re-restores.
      - ${RESONANCE_SCRATCH:-/home/narey/.local/share/resonance-dev}/backend-obj:/src/backend/obj
      - ${RESONANCE_SCRATCH:-/home/narey/.local/share/resonance-dev}/backend-bin:/src/backend/bin
      - ${RESONANCE_SCRATCH:-/home/narey/.local/share/resonance-dev}/tests-obj:/src/tests/obj
      - ${RESONANCE_SCRATCH:-/home/narey/.local/share/resonance-dev}/tests-bin:/src/tests/bin
      - ${RESONANCE_SCRATCH:-/home/narey/.local/share/resonance-dev}/backend-home:/home/dev
      # Downloads / incomplete live outside the project at absolute paths configured in the settings store.
      - /mnt/music:/downloads
      - /mnt/music/incomplete:/downloads/incomplete
      # Read-only Docker API access for per-container CPU/memory stats.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  frontend:
    image: node:22
    container_name: resonance-frontend
    networks:
      - resonance_backend_net
    user: "1000:1000"
    mem_limit: 3g
    cpus: 1
    working_dir: /src/frontend
    command: sh -c "npm install && npm start"
    environment:
      HOST: "0.0.0.0"
      HOME: /home/dev
      # Bind-mount file watching needs polling to fire reliably.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # craco proxies /api and /hub to localhost:5030, which only works because
      # caddy fronts this on resonance_backend_net rather than the browser
      # hitting this dev server's proxy target directly across containers.
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      # Silences "[DEP0060] DeprecationWarning: The `util._extend` API is deprecated" --
      # that's webpack-dev-server's bundled http-proxy-middleware -> http-proxy@1.18.1
      # calling util._extend internally (an upstream issue, not our code); Node 22 just
      # surfaces it more visibly than older Node did. util._extend still works fine.
      NODE_OPTIONS: "--no-deprecation"
    volumes:
      - ${RESONANCE_SRC:-/home/narey/projects/resonance}/frontend:/src/frontend
      # node_modules built fresh in-container (host's were built with a different node); isolated on scratch.
      - ${RESONANCE_SCRATCH:-/home/narey/.local/share/resonance-dev}/node_modules:/src/frontend/node_modules
      - ${RESONANCE_SCRATCH:-/home/narey/.local/share/resonance-dev}/frontend-home:/home/dev
    depends_on:
      - backend
    restart: unless-stopped

  # PO Token provider for yt-dlp's youtube extractor. YouTube increasingly requires a
  # Proof-of-Origin token (bound to SABR-only client responses) before it will serve
  # real media URLs; this generates them on request. Reachable from backend at
  # http://resonance-bgutil-pot-provider:4416 on resonance_backend_net -- yt-dlp's
  # plugin defaults to the old host-networking address (127.0.0.1:4416), so backend
  # points it here explicitly via extractor-args (see YtDlpService.cs's
  # PoTokenProviderFlag) rather than relying on that default.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: resonance-bgutil-pot-provider
    networks:
      - resonance_backend_net
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  # Resonance's own reverse proxy. Owns all app routing, rate limiting, security
  # headers and body limits. Reaches backend/frontend by container name on
  # resonance_backend_net; the outer/main proxy reaches this one via the published
  # 192.168.0.254:8443.
  caddy:
    build:
      context: caddy
      dockerfile: Dockerfile
    image: resonance-caddy
    container_name: resonance-caddy
    networks:
      - resonance_caddy_proxy_net
      - resonance_backend_net
    ports:
      - "192.168.0.254:8443:8443"
      - "192.168.0.254:8443:8443/udp"
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs
      - ./caddy/site:/srv
      - ./caddy/logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
